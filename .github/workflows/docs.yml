name: Publish documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: archipel-documentation
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    build:
        if: >-
            ${{ github.repository == 'pixel-brewery/archipel' &&
                github.event.repository.private == false && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: read
        env:
            NX_DAEMON: 'false'
            NX_PARALLEL: '1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Require the immutable public repository before building
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/requirePublicRepository.mjs
            - run: corepack enable
            - run: corepack prepare yarn@4.13.0 --activate
            - name: Install dependencies
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
              run: yarn install --immutable
            - name: Build the documentation site
              run: yarn docs:build
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/frontend/docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy the verified site artifact
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
