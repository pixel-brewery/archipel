name: Verify

on:
    push:
        branches-ignore: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:
        inputs:
            candidate_artifact:
                description: Prepared release bundle from this workflow run
                type: string
                default: ''
            candidate_source:
                description: Exact source revision of the prepared release
                type: string
                default: ''

permissions:
    contents: read
    packages: read

concurrency:
    group: verify-${{ github.event.pull_request.number || github.ref }}-${{ inputs.candidate_artifact || 'source' }}
    cancel-in-progress: ${{ inputs.candidate_artifact == '' }}

defaults:
    run:
        shell: bash

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        env:
            NX_DAEMON: 'false'
            NX_PARALLEL: '1'
            YARN_NODE_LINKER: node-modules
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Download the prepared candidate from this run
              if: inputs.candidate_artifact != ''
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ inputs.candidate_artifact }}
                  path: ${{ runner.temp }}/archipel-candidate

            - name: Validate and check out the exact prepared release
              if: inputs.candidate_artifact != ''
              env:
                  RELEASE_SOURCE_COMMIT: ${{ inputs.candidate_source }}
              run: node .github/scripts/verifyReleaseCandidate.mjs --directory "$RUNNER_TEMP/archipel-candidate" --checkout

            - run: corepack enable

            - name: Enable the pinned Yarn version
              run: corepack prepare yarn@4.13.0 --activate

            - name: Install dependencies
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
              run: yarn install --immutable

            - name: Verify all source, tooling, documentation, and ESM packages
              run: yarn verify

            - name: Require reproducible checked-in output
              run: |
                  git status --short
                  git diff --stat
                  test -z "$(git status --porcelain)"

            - name: Pack and validate every release tarball once
              if: inputs.candidate_artifact != '' && matrix.os == 'ubuntu-latest'
              run: node .github/scripts/packReleaseArtifacts.mjs --candidate "$RUNNER_TEMP/archipel-candidate/release-candidate.json" --output-dir "$RUNNER_TEMP/archipel-release"

            - name: Upload the verified release for the publisher
              if: inputs.candidate_artifact != '' && matrix.os == 'ubuntu-latest'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: verified-${{ inputs.candidate_artifact }}
                  path: ${{ runner.temp }}/archipel-release
                  if-no-files-found: error
                  retention-days: 7
