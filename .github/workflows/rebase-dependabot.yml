name: Refresh Dependabot updates

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: dependabot-rebase
    cancel-in-progress: false

jobs:
    rebase:
        if: github.repository == 'pixel-brewery/archipel' && github.event.repository.private == false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: write
        steps:
            # No PR checkout, dependency installation or artifact promotion.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Request one refresh per outdated PR and main revision
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: node .github/scripts/rebaseDependabotPullRequests.mjs
