name: Release Archipel packages

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            specifier:
                description: Version increment for both fixed release groups
                type: choice
                required: true
                default: patch
                options: [patch, minor, major]

permissions: {}

concurrency:
    group: archipel-release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    NX_DAEMON: 'false'
    NX_PARALLEL: '1'

jobs:
    prepare:
        if: >-
            ${{ github.repository == 'pixel-brewery/archipel' &&
                github.event.repository.private == false && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        outputs:
            artifact: archipel-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Require the immutable public repository before installing
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/requirePublicRepository.mjs
            - name: Require the triggering source to remain current
              run: |
                  set -euo pipefail
                  git fetch origin main --tags
                  test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
            - run: corepack enable
            - run: corepack prepare yarn@4.13.0 --activate
            - name: Install dependencies
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
              run: yarn install --immutable
            - name: Prepare both fixed release groups without publishing or remote writes
              env:
                  RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  node .github/scripts/prepareReleaseVersions.mjs
                  yarn docs
                  yarn prettier --write package.json 'libs/*/package.json' 'tools/*/package.json' '**/CHANGELOG.md' '.docs/packages/*/api/**/*.md'
                  node .github/scripts/prepareReleaseCandidate.mjs --directory "$RUNNER_TEMP/archipel-candidate"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: archipel-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/archipel-candidate
                  if-no-files-found: error
                  retention-days: 7

    verify:
        needs: prepare
        permissions:
            contents: read
            packages: read
        uses: ./.github/workflows/ci.yml
        with:
            candidate_artifact: ${{ needs.prepare.outputs.artifact }}
            candidate_source: ${{ github.sha }}

    publish:
        needs: [prepare, verify]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: release-main
        permissions:
            contents: write
            packages: write
            actions: write
        steps:
            # This job installs no dependencies and runs no package lifecycle scripts.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false
                  registry-url: https://npm.pkg.github.com
                  scope: '@pixel-brewery'
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: verified-${{ needs.prepare.outputs.artifact }}
                  path: ${{ runner.temp }}/archipel-release
            - name: Validate the exact commit, tags, package set and tarball bytes
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  node .github/scripts/requirePublicRepository.mjs
                  node .github/scripts/verifyReleaseCandidate.mjs --directory "$RUNNER_TEMP/archipel-release" --checkout --require-packed
            - name: Require the protected-main release App
              env:
                  RELEASE_APP_CONFIGURED: ${{ vars.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
              run: test "$RELEASE_APP_CONFIGURED" = true
            - name: Check freshness and remote tag ownership before requesting the push token
              id: publication
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/publishReleaseCandidate.mjs preflight --directory "$RUNNER_TEMP/archipel-release"
            - name: Create the narrowly scoped release push token
              if: steps.publication.outputs.needs_push == 'true'
              id: release-app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
            - name: Atomically push the verified metadata commit and both tags
              id: push
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
              run: node .github/scripts/publishReleaseCandidate.mjs push --directory "$RUNNER_TEMP/archipel-release"
            - name: Publish the verified tarballs without lifecycle scripts
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/publishReleaseCandidate.mjs packages --directory "$RUNNER_TEMP/archipel-release"
            - name: Verify every public package version and downloaded integrity
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
                  GH_TOKEN: ${{ github.token }}
              run: node tools/verify-published-packages.mjs --expected-manifest "$RUNNER_TEMP/archipel-release/release-candidate.json" --artifacts-dir "$RUNNER_TEMP/archipel-release"
            - name: Announce both verified release groups
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/publishReleaseCandidate.mjs releases --directory "$RUNNER_TEMP/archipel-release"
            - name: Publish the versioned documentation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
            # The metadata commit intentionally contains [skip ci]. Refresh explicitly,
            # including after a partial registry upload so remaining bot PRs do not stall.
            - name: Refresh remaining Dependabot branches
              if: always() && steps.push.outcome == 'success'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run rebase-dependabot.yml --repo "$GITHUB_REPOSITORY" --ref main
