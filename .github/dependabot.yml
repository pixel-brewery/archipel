# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      rebase-strategy: auto
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)
      groups:
          nestjs-updates:
              patterns: ['@nestjs/*']
          nx-updates:
              patterns: ['@nx/*', nx]
          prisma-updates:
              patterns: ['@prisma/*', prisma]
          testing-updates:
              patterns: [vitest, '@vitest/*', playwright, '@playwright/*']
          linting-updates:
              patterns: [eslint*, '@eslint/*', typescript-eslint, '@typescript-eslint/*', prettier]

    - package-ecosystem: github-actions
      directory: /
      rebase-strategy: auto
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore(ci)
      groups:
          github-actions-updates:
              patterns: ['*']
