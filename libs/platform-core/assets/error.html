<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
        <base href="/" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <title>{{statusCode}} - {{title}}</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            :root {
              --color-primary: {{style.primary}};
              --color-secondary: {{style.secondary}};
            }

            @keyframes shimmer {
              0%,
              100% {
                background-position: 0% 50%;
              }
              50% {
                background-position: 100% 50%;
              }
            }

            @keyframes slow-rotate {
              from {
                transform: rotate(0deg);
              }
              to {
                transform: rotate(360deg);
              }
            }

            .gradient-text {
              background: linear-gradient(135deg, #fff 45%, var(--color-primary) 100%);
              -webkit-background-clip: text;
              background-clip: text;
              -webkit-text-fill-color: transparent;
              animation: shimmer 3s ease-in-out infinite;
            }

            .bg-orb {
              background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--color-primary) 8%, transparent) 0%, transparent 50%);
              animation: slow-rotate 30s linear infinite;
            }
        </style>
    </head>
    <body class="flex min-h-screen items-center justify-center overflow-x-hidden bg-[#0d0d0d] text-[#e5e5e5] font-sans relative">
        <div class="fixed -inset-[50%] pointer-events-none -z-10 bg-orb"></div>
        <div class="relative z-10 max-w-xl space-y-8 rounded-3xl border border-white/10 bg-black/40 px-8 py-10 text-center shadow-2xl backdrop-blur">
            <div class="relative mx-auto h-48 w-48">
                <div class="absolute inset-0 rounded-full bg-gradient-to-br from-[var(--color-primary)] to-[var(--color-secondary)] blur-3xl"></div>
                <div class="relative flex h-full w-full items-center justify-center text-6xl font-bold text-white drop-shadow-lg">{{statusCode}}</div>
            </div>

            <div class="space-y-3">
                <h1 class="text-3xl font-semibold text-white">{{title}}</h1>
                <p class="text-lg leading-relaxed text-white/70">{{message}}</p>
            </div>

            {{#if showDetails}}
            <div class="rounded-2xl border border-white/10 bg-white/5 px-5 py-4 text-left text-sm leading-relaxed text-white/70">
                <div class="mb-2 text-sm font-semibold text-white">Request Path:</div>
                <div class="font-mono break-all text-white/80">{{path}}</div>
                {{#if timestamp}}
                <div class="mt-3 text-sm font-semibold text-white">Timestamp:</div>
                <div class="font-mono break-all text-white/80">{{timestamp}}</div>
                {{/if}}
            </div>
            {{/if}}

            <a
                href="/"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] px-5 py-3 text-sm font-semibold text-white shadow-lg transition hover:-translate-y-0.5"
                target="_self"
                rel="noreferrer"
                >{{actionText}}</a
            >

            <div class="text-xs text-white/60">{{footer.copyright}}</div>
        </div>
    </body>
</html>
